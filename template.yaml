AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  kordis.cloud

  Sample SAM Template for kordis.cloud

Parameters:
  DomainName:
    Type: String
    Default: "kordis.cloud"
    Description: The root domain name for the service.
  
  HostedZoneId:
    Type: String
    Default: "Z05030141Q82CAW2GKME0"
    Description: "The Hosted Zone ID for the DNS records in Route 53."
  
  DynamoDBTableName:
    Type: String
    Default: "kordis-cloud"
    Description: The name of the DynamoDB table.

  S3BucketName:
    Type: String
    Default: "kordis-cloud"
    Description: The name of the S3 bucket for static content.

  ReservedConcurrency:
    Type: Number
    Default: 2
    MinValue: 0
    Description: >
      Reserved concurrency for each counter Lambda, a hard cap on parallel runs.
      Set 0 to leave it unreserved (needed if the account concurrency limit is only 10).

Conditions:
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]


# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 3
    MemorySize: 128
    ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
    Environment:
      Variables:
        TABLE_NAME: !Ref DynamoDBTableName
        ALLOWED_ORIGINS: !Sub "https://${DomainName},https://www.${DomainName}"

Resources:
  
  KordisCloudWildcardCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub "*.${DomainName}"
      SubjectAlternativeNames:
      - !Ref DomainName
      ValidationMethod: DNS

  KordisCloudBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BucketName
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref DynamoDBTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # Expires the daily visitor markers written by the PUT function
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        ViewerCertificate:
          AcmCertificateArn: !Ref KordisCloudWildcardCertificate
          SslSupportMethod: sni-only
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        DefaultCacheBehavior:
          TargetOriginId: S3KordisCloudOrigin
          ViewerProtocolPolicy: redirect-to-https
          DefaultTTL: 0
          MaxTTL: 0
          MinTTL: 0       
          ForwardedValues:
            QueryString: false
        Origins:
          - DomainName: !GetAtt KordisCloudBucket.RegionalDomainName
            Id: S3KordisCloudOrigin
            CustomOriginConfig:
              OriginProtocolPolicy: match-viewer
        DefaultRootObject: index.html
        Enabled: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 0
 
  Route53RecordSetGroup:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt WebDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2 # This typically refers to the CloudFront distribution and should not be parameterized

        - Name: !Sub "www.${DomainName}"
          Type: A
          AliasTarget:
            DNSName: !GetAtt WebDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2 # This typically refers to the CloudFront distribution and should not be parameterized

  KordisCloudBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KordisCloudBucket
      PolicyDocument:
        Id: PublicReadS3Policy
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal: "*"
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${KordisCloudBucket}/*"

  ApiGatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Domain: 
        DomainName: !Sub "api.${DomainName}"
        CertificateArn: !Ref KordisCloudWildcardCertificate
        Route53:
          HostedZoneId: !Ref HostedZoneId 
      Auth:
        DefaultAuthorizer: NONE
        AddDefaultAuthorizerToCorsPreflight: false
      TracingEnabled: true
      # Stage-wide cap; a portfolio counter needs only a few requests per second
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10
          
  VisitorCountGetFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: visitor_get_function/
      Handler: app.lambda_handler
      Runtime: python3.13
      Tracing: Active
      Timeout: 10
      Architectures:
        - x86_64
      LoggingConfig:
        LogGroup: !Ref VisitorCountGetLogGroup
      Events:
        Getvisits:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /visits
            Method: get
            RestApiId: 
              Ref: ApiGatewayApi
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt DynamoDBTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys:
                    - visits

  VisitorCountGetLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-visitor-get"
      RetentionInDays: 14

  VisitorCountPutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: visitor_put_function/
      Handler: app.lambda_handler
      Runtime: python3.13
      Tracing: Active
      Architectures:
        - x86_64
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref VisitorCountPutLogGroup
      Events:
        UpdateVisits:
          Type: Api
          Properties:
            Path: /visits
            Method: put
            RestApiId: 
              Ref: ApiGatewayApi
        # CORS preflight is answered by the function so only the portfolio origins are allowed
        UpdateVisitsPreflight:
          Type: Api
          Properties:
            Path: /visits
            Method: options
            RestApiId:
              Ref: ApiGatewayApi
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt DynamoDBTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys:
                    - visits
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt DynamoDBTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys:
                    - "visitor#*"

  VisitorCountPutLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-visitor-put"
      RetentionInDays: 14

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  # Find out more about other implicit resources you can reference within SAM
  # https://github.com/awslabs/serverless-application-model/blob/master/docs/internals/generated_resources.rst#api
  KordisCloudAPI:
    Description: "API Gateway endpoint URL for kordis.cloud"
    Value: !Sub "https://api.${DomainName}/"
  VisitorCountApi:
    Description: "API Gateway endpoint URL for Prod stage for Visitor Count function"
    Value: !Sub "https://${VisitorCountGetFunction}.execute-api.${AWS::Region}.amazonaws.com/Prod/visits/"
  VisitorCountGetFunction:
    Description: "Visitor Count Lambda Function ARN"
    Value: !GetAtt VisitorCountGetFunction.Arn
  VisitorCountFunctionIamRole:
    Description: "Implicit IAM Role created for Visitor Count function"
    Value: !GetAtt VisitorCountGetFunctionRole.Arn
