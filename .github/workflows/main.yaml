name: main

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manual "Run workflow" button; always deploys infra and site

permissions:
  contents: read

jobs:
  # Decide whether the AWS stack needs a deploy: only when infra files changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for infra changes
      id: diff
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
          echo "infra=true" >> "$GITHUB_OUTPUT"
        elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(template\.yaml|samconfig\.toml|visitor_get_function/|visitor_put_function/|scripts/|tests/(unit|integration)/|\.github/workflows/)'; then
          echo "infra=true" >> "$GITHUB_OUTPUT"
        else
          echo "infra=false" >> "$GITHUB_OUTPUT"
        fi

  test-infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Cache Python packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install awscli boto3
        pip install -r tests/requirements.txt
        pip install aws-sam-cli

    - name: Run tests
      run: pytest -v tests/unit

    - name: Validate CloudFormation template
      run: sam  validate

  build-deploy-infra:
    needs: test-infra
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Build infrastructure
      run: sam build

    - name: Deploy infrastructure
      run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

  integration-tests:
    needs: build-deploy-infra
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
    - name: Set AWS SAM Stack Name
      run: echo "AWS_SAM_STACK_NAME=kordis-cloud" >> $GITHUB_ENV
    - name: Run Integration Tests
      run: pytest -vv tests/integration/test_api_gateway.py

  # Delete SAM packages the stack no longer uses (older than 30 days) and expire
  # their old versions. Best effort: a failure here never blocks a deploy.
  cleanup-sam-artifacts:
    needs: integration-tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    - name: Clean up old SAM artifacts
      run: |
        pip install boto3
        python scripts/cleanup_sam_artifacts.py --stack kordis-cloud --prefix kordis-cloud

  deploy-site:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Dependencies
        run: |
          npm install --save-dev ajv@^7
          rm -rf ./dev-portfolio/node_modules
          rm -f ./dev-portfolio/package-lock.json
          npm install --prefix ./dev-portfolio --legacy-peer-deps
      - name: Build the website files
        run: npm run --prefix ./dev-portfolio build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Sync Website files to S3 Bucket
        run: aws s3 sync ./dev-portfolio/build s3://kordis-cloud --delete

  e2e-tests:
    if: ${{ vars.SKIP_E2E_TESTS == 'false' }}
    needs: deploy-site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest selenium

      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          wget -q "https://chromedriver.storage.googleapis.com/${CHROME_VERSION}/chromedriver_linux64.zip"
          sudo unzip -q chromedriver_linux64.zip -d /usr/local/bin/
          rm chromedriver_linux64.zip

      - name: Run E2E Tests
        run: pytest tests/e2e/
        env:
          PYTHONPATH: ${{ github.workspace }}
