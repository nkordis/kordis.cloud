name: main

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manual "Run workflow" button; always deploys infra and site

# AWS access uses GitHub OIDC: each job that needs AWS assumes its own narrow role
# (see docs/github-oidc-plan.md). No long-lived AWS keys are stored in GitHub.
permissions:
  contents: read

# One deploy at a time: a second sam deploy fails while the stack is updating
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  # Decide whether the AWS stack needs a deploy: only when infra files changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check for infra changes
      id: diff
      env:
        BEFORE: ${{ github.event.before }}
      run: |
        if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
          echo "infra=true" >> "$GITHUB_OUTPUT"
        elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(template\.yaml|samconfig\.toml|visitor_get_function/|visitor_put_function/|scripts/|tests/(unit|integration)/|\.github/workflows/)'; then
          echo "infra=true" >> "$GITHUB_OUTPUT"
        else
          echo "infra=false" >> "$GITHUB_OUTPUT"
        fi

  test-infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Cache Python packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install awscli boto3
        pip install -r tests/requirements.txt
        pip install aws-sam-cli

    # Unit tests use moto, so they get fake credentials instead of real ones
    - name: Run tests
      env:
        AWS_ACCESS_KEY_ID: testing
        AWS_SECRET_ACCESS_KEY: testing
        AWS_DEFAULT_REGION: us-east-1
      run: pytest -v tests/unit

    - name: Validate CloudFormation template
      run: sam validate --lint --region us-east-1

  build-deploy-infra:
    needs: test-infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_INFRA_ROLE_ARN }}
        role-session-name: kordis-cloud-deploy-infra
        aws-region: us-east-1

    - name: Build infrastructure
      run: sam build

    - name: Deploy infrastructure
      # CloudFormation creates the resources with its own execution role, not the GitHub role
      run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --role-arn "${{ vars.AWS_CFN_EXECUTION_ROLE_ARN }}"

  integration-tests:
    needs: build-deploy-infra
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt
    # The public API URL is known, so these tests need no AWS credentials
    - name: Run Integration Tests
      env:
        KORDIS_API_URL: https://api.kordis.cloud/
      run: pytest -vv tests/integration/test_api_gateway.py

  # Delete SAM packages the stack no longer uses (older than 30 days) and expire
  # their old versions. Best effort: a failure here never blocks a deploy.
  cleanup-sam-artifacts:
    needs: integration-tests
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_INFRA_ROLE_ARN }}
        role-session-name: kordis-cloud-cleanup-artifacts
        aws-region: us-east-1
    - name: Clean up old SAM artifacts
      run: |
        pip install boto3
        python scripts/cleanup_sam_artifacts.py --stack kordis-cloud --prefix kordis-cloud

  deploy-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Dependencies
        run: |
          npm install --save-dev ajv@^7
          rm -rf ./dev-portfolio/node_modules
          rm -f ./dev-portfolio/package-lock.json
          npm install --prefix ./dev-portfolio --legacy-peer-deps
      - name: Build the website files
        run: npm run --prefix ./dev-portfolio build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_SITE_ROLE_ARN }}
          role-session-name: kordis-cloud-deploy-site
          aws-region: us-east-1
      # Hashed build assets first (cached for a year, never change), then
      # everything else with a short cache so HTML and profile JSON update within 5 minutes.
      # Old hashed assets are kept so pages still cached at the edge can load them.
      - name: Sync Website files to S3 Bucket
        run: |
          aws s3 sync ./dev-portfolio/build/static s3://kordis-cloud/static \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync ./dev-portfolio/build s3://kordis-cloud --delete \
            --exclude "static/*" \
            --cache-control "public, max-age=300"

  e2e-tests:
    if: ${{ vars.SKIP_E2E_TESTS == 'false' }}
    needs: deploy-site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest selenium

      - name: Install Chrome and ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          wget -q "https://chromedriver.storage.googleapis.com/${CHROME_VERSION}/chromedriver_linux64.zip"
          sudo unzip -q chromedriver_linux64.zip -d /usr/local/bin/
          rm chromedriver_linux64.zip

      - name: Run E2E Tests
        run: pytest tests/e2e/
        env:
          PYTHONPATH: ${{ github.workspace }}
